spring:
  datasource:
    url: jdbc:mysql://localhost:3307/ecommerce_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

    # BẮT BUỘC để data.sql chạy SAU khi Hibernate tạo bảng
    defer-datasource-initialization: true

  sql:
    init:
      mode: always


ecommerce:
  security:
    jwt-secret: THIS_IS_A_VERY_LONG_AND_SECURE_JWT_SECRET_KEY_123456789
    jwt-expiration-ms: 900000
    jwt-refresh-expiration-ms: 604800000
