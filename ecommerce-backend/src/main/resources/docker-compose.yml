version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: ecommerce_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: ecommerce_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Thêm Redis vào đây
  redis:
    image: redis:7.0-alpine
    container_name: ecommerce_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mysql_data: